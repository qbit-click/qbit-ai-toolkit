project_name: "{{SERENA_PROJECT_NAME}}"
languages:
- rust
- powershell
- bash
- python
encoding: utf-8
line_ending: native
language_backend: LSP
ignore_all_files_in_gitignore: true
ls_specific_settings:
  rust:
    ls_base_cmd:
      - rustup
      - run
      - "{{RUST_TOOLCHAIN_VERSION}}"
      - rust-analyzer
  powershell:
    pses_version: "4.4.0"
    psscriptanalyzer_version: "1.25.0"
  python:
    ls_path: "/opt/serena-language-servers/node_modules/.bin/pyright-langserver"
    pyright_version: "1.1.403"
  bash:
    ls_path: "/opt/serena-language-servers/node_modules/.bin/bash-language-server"
    bash_language_server_version: "5.6.0"
additional_workspace_folders: []
ignored_paths:
  - target
  - .ai/cache
  - .ai/state
  - graphify-out
read_only: false
excluded_tools: []
included_optional_tools: []
fixed_tools: []
default_modes: null
added_modes: null
initial_prompt: ""
symbol_info_budget: 10
read_only_memory_patterns: []
ignored_memory_patterns: []
