name: qbit-ai-toolkit-ai

services:
  serena:
    image: qbit-ai-toolkit-ai-runtime:phase2a
    platform: linux/amd64
    build:
      context: .
      dockerfile: .ai/tooling/Dockerfile
      platforms:
        - linux/amd64
    user: "0:0"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETPCAP
      - SETUID
    network_mode: none
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777,size=256m
    working_dir: /workspace
    entrypoint:
      - python
      - -I
      - /usr/local/libexec/runtime-entrypoint.py
      - serena
      - --
    command:
      - serena
      - start-mcp-server
      - --transport
      - stdio
      - --project
      - /workspace
      - --context
      - /workspace/.serena/codex-single-project.yml
      - --tool-timeout
      - "45"
    environment:
      SERENA_HOME: /serena-state
    volumes:
      - type: bind
        source: .
        target: /workspace
        read_only: false
      - type: volume
        source: serena-state
        target: /serena-state
        read_only: false
        volume:
          nocopy: true
      - type: volume
        source: serena-resources
        target: /serena-resources
        read_only: false
        volume:
          nocopy: true

  graphify:
    image: qbit-ai-toolkit-ai-runtime:phase2a
    platform: linux/amd64
    build:
      context: .
      dockerfile: .ai/tooling/Dockerfile
      platforms:
        - linux/amd64
    user: "0:0"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETPCAP
      - SETUID
    network_mode: none
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777,size=256m
    working_dir: /workspace
    entrypoint:
      - python
      - -I
      - /usr/local/libexec/runtime-entrypoint.py
      - graphify
      - --
    command:
      - python
      - -I
      - /usr/local/libexec/graphify-runtime.py
    volumes:
      - type: bind
        source: .
        target: /workspace
        read_only: true
      - type: volume
        source: graphify-output
        target: /graphify-output
        read_only: false
        volume:
          nocopy: true

  doctor:
    image: qbit-ai-toolkit-ai-runtime:phase2a
    platform: linux/amd64
    build:
      context: .
      dockerfile: .ai/tooling/Dockerfile
      platforms:
        - linux/amd64
    user: "10001:10001"
    cap_drop:
      - ALL
    cap_add: []
    network_mode: none
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777,size=256m
      - /serena-state/logs:rw,nosuid,nodev,noexec,mode=0700,uid=10001,gid=10001,size=32m
      - /serena-state/projects/qbit-ai-toolkit/cache:rw,nosuid,nodev,noexec,mode=0700,uid=10001,gid=10001,size=64m
    working_dir: /workspace
    entrypoint:
      - python
      - -I
      - /usr/local/libexec/doctor.py
    environment:
      HOME: /tmp
      SERENA_HOME: /serena-state
      XDG_CACHE_HOME: /tmp/cache
    volumes:
      - type: bind
        source: .
        target: /workspace
        read_only: true
      - type: volume
        source: serena-state
        target: /serena-state
        read_only: true
      - type: volume
        source: serena-resources
        target: /serena-resources
        read_only: true
      - type: volume
        source: graphify-output
        target: /graphify-output
        read_only: true

volumes:
  serena-state: {}
  serena-resources: {}
  graphify-output: {}
